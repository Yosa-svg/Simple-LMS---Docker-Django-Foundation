services:
  # ===========================================================================
  # Django Web Application
  # ===========================================================================
  app:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - mongodb
      - rabbitmq

  # ===========================================================================
  # PostgreSQL — Primary Database
  # ===========================================================================
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"

  # ===========================================================================
  # Redis — Cache & Rate Limiting & Celery Result Backend
  # Modul 9: Caching course list, course detail, rate limiting
  # ===========================================================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  # ===========================================================================
  # MongoDB — Activity Logs & Learning Analytics
  # Modul 9: Document store untuk activity logs yang tidak perlu relasional
  # ===========================================================================
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=simple_lms_logs

  # ===========================================================================
  # RabbitMQ — Message Broker untuk Celery
  # Modul 9: Antrian pesan untuk async tasks
  # Management UI: http://localhost:15672 (guest/guest)
  # ===========================================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-guest}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ===========================================================================
  # Celery Worker — Memproses Async Tasks
  # Modul 9: send_enrollment_email, generate_certificate, export_course_report
  # ===========================================================================
  celery-worker:
    build: .
    command: celery -A config worker --loglevel=info --concurrency=4 -E
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq
      - mongodb

  # ===========================================================================
  # Celery Beat — Scheduled Task Scheduler
  # Modul 9: update_course_statistics (setiap jam)
  # ===========================================================================
  celery-beat:
    build: .
    command: celery -A config beat --loglevel=info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
      - redis
      - rabbitmq

  # ===========================================================================
  # Flower — Celery Monitoring Dashboard
  # Modul 9: Monitor task queue, worker status, task history
  # Dashboard: http://localhost:5555
  # ===========================================================================
  flower:
    build: .
    command: celery -A config flower --port=5555
    volumes:
      - .:/app
    ports:
      - "5555:5555"
    env_file:
      - .env
    depends_on:
      - rabbitmq
      - redis
      - db

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  rabbitmq_data: